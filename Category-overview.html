<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Category Overview | Personal Finance Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="bg-white border-bottom py-3">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
            <h1 class="h4 fw-bold mb-0">Finance Tracker</h1>
            <nav class="d-flex align-items-center gap-3 links">
                <a href="index.html" class="text-decoration-none small fw-bold">Dashboard</a>
                <a href="Transaction-List.html" class="text-decoration-none small fw-bold">Transactions</a>
                <a href="Category-overview.html" class="text-decoration-none small fw-bold">Category</a>
                <div class="avatar-placeholder">JD</div>
            </nav>
        </div>
    </header>
    
    <main class="container">
        <header
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-end border-bottom pb-4 mb-5 mt-3">
            <div>
                <h1 class="fw-bold h3 mb-1">Category Overview</h1>
                <p class="text-muted small mb-0">A detailed breakdown of your monthly spending habits.</p>
            </div>
            <div class="text-md-end mt-3 mt-md-0" id="TotalExpenses">
                <!-- Transactions will be dynamically inserted here by JavaScript -->
            </div>
        </header>

        <div class="card-custom mb-5 overflow-hidden">
            <div class="px-4 py-3 border-bottom bg-light bg-opacity-50">
                <h2 class="h6 fw-bold mb-0 text-dark">Expenses by Category</h2>
            </div>

            <div class="list-group list-group-flush" id="ExpensesList">
                <!-- Transactions will be dynamically inserted here by JavaScript -->
            </div>

            <footer
                class="bg-light px-4 py-3 border-top d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
                <p class="text-muted x-small mb-0 italic text text ">Data updated as of October 2023
                </p>
                <button class="btn btn-brand btn-sm rounded-2 px-4 shadow-sm">Download PDF Report</button>
            </footer>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card-custom p-4" id="HighestExpense">
                    <!-- Transactions will be dynamically inserted here by JavaScript -->
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-custom p-4" id="Average">
                    <!-- Transactions will be dynamically inserted here by JavaScript -->
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-custom p-4">
                    <p class="stat-label mb-1">Budget Status</p>
                    <p class="h4 fw-bold mb-0 text-success">On Track</p>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="text-center py-5 text-muted small">
        <p>© 2023 Personal Finance Dashboard. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
       <script src="js/Category-overview.js"></script>
</body>

</html>
